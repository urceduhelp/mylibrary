<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>මගේ පුස්තකාලය</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1d5c4a;--bd:#ddd9ce;--rd:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--tx:#efece4;--mu:#9b978c;--ac:#4fb394;--bd:#38352f;--rd:#f2766e}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:7px 12px;border:0;border-radius:7px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--rd);border:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--bd)}
.tabs button{background:transparent;color:var(--mu);border-radius:7px 7px 0 0;padding:9px 16px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:10px}
label{font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#msg{font-size:13px;color:var(--mu);margin:6px 0}
.hide{display:none!important}
#sbar{position:sticky;top:0;z-index:20;margin-bottom:14px}
.stat{font-size:14px;color:var(--mu);margin:0 0 12px}
.stat b{color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.kpi small{display:block;color:var(--mu);font-size:12px}
.kpi div{font-size:20px;margin-top:4px;word-break:break-word}
.kpi span{display:block;font-size:13px;color:var(--mu);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.barx{height:8px;background:var(--ac);border-radius:4px;min-width:2px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;background:var(--card);border:2px solid;border-radius:6px;overflow:hidden;min-height:200px}
.th{padding:14px 8px;text-align:center;color:#222}
.tt{font-size:21px;line-height:1.25}
.tv{font-size:13px;margin-top:2px}
.tb{flex:1;padding:10px 12px;text-align:center;font-size:14px;display:flex;flex-direction:column;gap:7px}
.tb hr{width:100%;border:0;border-top:1px solid;margin:0}
.tf{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:13px}
.tf .row{gap:4px}.tf button{padding:2px 8px;font-size:12px}
/* popup */
#pop{position:fixed;left:0;right:0;margin:0 auto;width:calc(100% - 32px);max-width:968px;bottom:16px;z-index:15;
 background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column}
#pop .ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);gap:8px}
#pop .pb{overflow:auto;padding:14px;flex:1}
.pager{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0 0}
.warn{background:#fff3cd;color:#5c4400;border:1px solid #e6c34a;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.warn div{margin-top:4px}
.warn button{padding:1px 8px;font-size:12px;color:#5c4400;border-color:#c9a53a}
#sug{position:fixed;z-index:60;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-height:260px;overflow:auto}
#sug div{padding:7px 10px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px}
#sug div.on,#sug div:hover{background:var(--bg)}
#sug small{color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,92vw)}
.dd-new{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:99}
#printarea{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body.printing{background:#fff}
 body.printing .wrap,body.printing dialog,body.printing #toast,body.printing #sug{display:none!important}
 body.printing #printarea{display:block;color:#000;background:#fff;font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif}
 #printarea h2{margin:0 0 4px;font-size:16px}#printarea p{margin:0 0 8px;font-size:11px}
 #printarea table{font-size:9px;width:100%;border-collapse:collapse}
 #printarea th,#printarea td{border:1px solid #888;padding:3px 4px;vertical-align:top;word-break:break-word}
 #printarea th{background:#e8e8e8}#printarea thead{display:table-header-group}#printarea tr{page-break-inside:avoid}
}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="toast" class="hide"></div>
<div id="printarea"></div>
<div class="wrap">

<div class="bar"><h1>📚 මගේ පුස්තකාලය</h1></div>
<div class="tabs">
  <button id="tb_s" class="on" onclick="tab('s')">🔍 සෙවීම</button>
  <button id="tb_a" onclick="tab('a')">⚙ Admin</button>
</div>

<!-- ============ SEARCH TAB ============ -->
<div id="tabS">
  <p class="stat" id="sstat">...</p>

  <div id="sbar" class="card">
    <input id="q" data-sug="q" placeholder="🔍 නම, කතුවරයා, විෂයය, ISBN හෝ පොත් අංකය මගින් සොයන්න..." oninput="onSearch()">
    <div class="row" style="margin-top:8px">
      <select id="fr" onchange="rackChanged()" style="width:150px"></select>
      <select id="fs" onchange="onSearch()" style="width:150px"></select>
      <button class="g" onclick="clearSearch()">හිස් කරන්න</button>
    </div>
  </div>

  <div id="pop" class="hide">
    <div class="ph"><b id="pcnt"></b><span class="row"><button class="g" onclick="copyResults()">📋 සියල්ල Copy</button><button class="g" onclick="closePop()">✕ වසන්න</button></span></div>
    <div class="pb"><div id="ptiles" class="tiles"></div>
      <div class="pager"><button class="g" onclick="popGo(-1)">← පෙර</button><span id="ppg"></span><button class="g" onclick="popGo(1)">ඊළඟ →</button></div></div>
  </div>

  <b>සියලු පොත්</b>
  <div id="tiles" class="tiles" style="margin-top:8px"></div>
  <div class="pager"><button class="g" onclick="go(-1)">← පෙර</button><span id="pg"></span><button class="g" onclick="go(1)">ඊළඟ →</button></div>
</div>

<!-- ============ ADMIN TAB ============ -->
<div id="tabA" class="hide">

  <div id="alogin" class="card hide" style="max-width:380px;margin:30px auto">
    <h1>Admin — Login</h1><br>
    <label>Email</label><input id="em" type="email"><br><br>
    <label>මුරපදය</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')signIn()"><br><br>
    <button onclick="signIn()">ඇතුල් වන්න</button>
    <div id="lmsg" style="color:var(--rd);font-size:13px;margin-top:8px"></div>
  </div>

  <div id="apanel" class="hide">
    <div class="bar"><b>සංඛ්‍යාන</b><button class="g" onclick="signOut()">Logout</button></div>
    <div class="kpis" id="kpis"></div>
    <div class="card"><b>දත්ත Download කරන්න</b>
      <div class="row" style="margin-top:8px"><button onclick="exportXLSX()">⬇ Excel (.xlsx)</button><button onclick="exportPDF()">⬇ PDF</button>
        <span style="font-size:12px;color:var(--mu)">PDF සඳහා print කවුළුවේ "Save as PDF" තෝරන්න.</span></div></div>
    <div class="card"><b>විෂයයන් අනුව පොත් ගණන</b>
      <div style="overflow:auto;margin-top:8px"><table id="subj"></table></div>
    </div>

    <div class="card">
      <b>නව පොතක් ඇතුළත් කරන්න</b> <span style="font-size:12px;color:var(--mu)">(පොත් අංකය ස්වයංක්‍රීයව ලැබේ; අවශ්‍ය නම් වෙනස් කළ හැක)</span>
      <div class="grid" id="addf" style="margin-top:10px"></div>
      <div id="dup" class="warn hide"></div>
      <div class="row">
        <button onclick="addBook()">සුරකින්න</button>
        <button class="g" onclick="resetAdd()">හිස් කරන්න</button>
        <span style="flex:1"></span>
        <label class="row" style="font-size:13px">CSV Import:&nbsp;<input type="file" id="csv" accept=".csv,.tsv,.txt" style="width:auto" onchange="importCSV(this.files[0])"></label>
      </div>
      <div id="msg"></div>
    </div>

    <div class="row" style="margin-bottom:8px"><b id="acnt">සියලු පොත්</b><span style="flex:1"></span>
      <input id="aq" placeholder="🔍 සංස්කරණයට පොතක් සොයන්න..." style="max-width:320px" oninput="clearTimeout(window.at);window.at=setTimeout(()=>{apage=0;loadA()},300)"></div>
    <div id="atiles" class="tiles"></div>
    <div class="pager"><button class="g" onclick="goA(-1)">← පෙර</button><span id="apg"></span><button class="g" onclick="goA(1)">ඊළඟ →</button></div>
  </div>
</div>

</div>

<!-- Edit dialog (admin only) -->
<dialog id="ed">
  <h3 style="margin:0 0 4px">පොත සංස්කරණය</h3>
  <div id="etitle" style="font-size:13px;color:var(--mu);margin-bottom:10px"></div>
  <div class="grid" id="editf"></div>
  <div class="row">
    <button onclick="saveEdit()">සුරකින්න</button>
    <button class="g" onclick="ed.close()">අවලංගු</button>
    <span style="flex:1"></span>
    <button class="d" onclick="delFromEdit()">🗑 Delete</button>
  </div>
  <div id="emsg" style="color:var(--rd);font-size:13px;margin-top:6px"></div>
</dialog>

<!-- Duplicate dialog -->
<dialog id="dd">
  <h3 style="margin:0 0 8px">⚠ මෙම නමින් (සහ කොටසින්) පොතක් දැනටමත් ඇත</h3>
  <div class="dd-new" id="ddnew"></div>
  <div id="ddlist"></div>
  <div class="row" style="margin-top:10px">
    <button id="ddgo" onclick="ddGo()"></button>
    <button class="g" onclick="dd_.close()">අවලංගු</button>
  </div>
</dialog>

<script>
const SUPABASE_URL = "https://jcijglwpkfluyzrltimk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const FIELDS = [["title","පොතේ නම"],["volume","කොටස (උදා: පළමු කොටස)"],["author","කතුවරයා"],["subject","විෂයය (උදා: ඉතිහාසය/ආගම)"],
  ["publisher","ප්‍රකාශකයා"],["print_year","මුද්‍රිත වර්ෂය","number"],["pages","පිටු ගණන","number"],["price","මිල","number"],["isbn","ISBN"],["book_number","පොත් අංකය"],["rack_number","රාක්ක අංකය"],["shelf_number","තට්ටු අංකය"]];
const F = FIELDS.map(f => f[0]);
const SIZE = 30, PSIZE = 24;
let page = 0, apage = 0, popPage = 0, editId = null, timer, isAdmin = false; const cache = {};

const HUES = {"ඉතිහාසය":210,"ආගම":30,"විද්‍යාව":150,"මනෝවිද්‍යාව":0,"සාහිත්‍යය":280,"භාෂාව":50};
function colorOf(subject){
  const first = (subject || "").split(/[\/,|]/)[0].trim();
  if(!first) return {bg:"hsl(0 0% 78%)", bd:"hsl(0 0% 55%)"};
  let h = HUES[first];
  if(h === undefined){ h = 0; for(const ch of first) h = (h*31 + ch.charCodeAt(0)) % 360; }
  return {bg:`hsl(${h} 55% 78%)`, bd:`hsl(${h} 40% 55%)`};
}
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = v => { v = (v ?? "").toString().trim(); return v === "" ? null : v; };
const money = n => "Rs." + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

/* valuation: මුද්‍රිත වර්ෂයේ සිට වර්ෂයකට GROWTH ප්‍රතිශතයකින් වැඩිවේ. COMPOUND=false නම් සරල (මුල් මිලෙන් 30%) */
const GROWTH = 0.30, COMPOUND = true, NOWY = new Date().getFullYear();
const NUM = ["price","print_year","pages"];
const numFix = o => { NUM.forEach(k => { if(o[k] !== null){ const n = parseFloat(o[k]); o[k] = isNaN(n) ? null : (k === "price" ? n : Math.round(n)); } }); return o; };
const hasAdj = b => b.price != null && Number(b.print_year) > 0 && Number(b.print_year) <= NOWY;
function adjVal(b){
  if(b.price == null) return null;
  if(!hasAdj(b)) return Number(b.price);
  const n = NOWY - Number(b.print_year), p = Number(b.price);
  return p * (COMPOUND ? Math.pow(1 + GROWTH, n) : 1 + GROWTH * n);
}

/* රාක්ක / තට්ටු dropdown */
const RACKS = Array.from({length:10}, (_, i) => String(i + 1));
const SHELVES = ["1","2","3","4","5","6"], SHELVES_X = [...SHELVES, "1a","1b","2a","2b"];
const shelvesFor = r => r === "2" ? SHELVES_X : SHELVES;
function fillSel(sel, list, cur, label){
  const items = cur && !list.includes(cur) ? [...list, cur] : list;
  sel.innerHTML = `<option value="">${label || "— තෝරන්න —"}</option>` + items.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  sel.value = cur || "";
}
function setLoc(p, rack, shelf){ fillSel($(p+"rack_number"), RACKS, rack); fillSel($(p+"shelf_number"), shelvesFor(rack), shelf); }
const searchShelves = () => ["", "2"].includes($("fr").value) ? SHELVES_X : SHELVES;
function rackChanged(){ const l = searchShelves(), c = $("fs").value; fillSel($("fs"), l, l.includes(c) ? c : "", "සියලු තට්ටු"); onSearch(); }

/* පොත් අංක ස්වයංක්‍රීය: භාවිතා නොකළ කුඩාම අංකය */
let usedNos = new Set(), nextNo = 1, autoNo = null;
const freeNo = set => { let n = 1; while(set.has(String(n))) n++; return n; };
function fillNo(){ const el = $("f_book_number"); if(el && (el.value.trim() === "" || el.value === autoNo)) el.value = autoNo = String(nextNo); }
async function refreshNextNo(){
  const set = new Set();
  for(let p = 0; ; p++){
    const {data, error} = await sb.from("books").select("book_number").not("book_number", "is", null).order("id").range(p*1000, p*1000 + 999);
    if(error) return;
    data.forEach(r => set.add(String(r.book_number).trim())); if(data.length < 1000) break;
  }
  usedNos = set; nextNo = freeNo(set); fillNo();
}

/* forms */
const fieldsHTML = p => FIELDS.map(([k,l,t]) => k === "rack_number" || k === "shelf_number" ? `<div><label>${l}</label><select id="${p}${k}"></select></div>` : `<div><label>${l}</label><input id="${p}${k}" ${t==="number"?"":`data-sug="${k}"`} type="${t||"text"}" ${t==="number"?`step="${k==="price"?"0.01":"1"}"`:""}></div>`).join("");
$("addf").innerHTML = fieldsHTML("f_"); $("editf").innerHTML = fieldsHTML("e_");
["f_","e_"].forEach(p => { setLoc(p, "", "");
  $(p+"rack_number").addEventListener("change", () => { const l = shelvesFor($(p+"rack_number").value), c = $(p+"shelf_number").value; fillSel($(p+"shelf_number"), l, l.includes(c) ? c : ""); }); });
fillSel($("fr"), RACKS, "", "සියලු රාක්ක"); fillSel($("fs"), SHELVES_X, "", "සියලු තට්ටු");
function readForm(p){
  const o = {}; F.forEach(k => o[k] = clean($(p+k).value));
  return numFix(o);
}
const say = t => $("msg").textContent = t;
function resetAdd(){ F.forEach(k => $("f_"+k).value = ""); setLoc("f_", "", ""); autoNo = null; fillNo(); $("dup").classList.add("hide"); }
const isEmpty = o => Object.values(o).every(v => v === null);

/* tabs + auth */
function tab(t){
  hideSug(); closePop();
  $("tabS").classList.toggle("hide", t !== "s"); $("tabA").classList.toggle("hide", t !== "a");

const likeEsc = v => v.replace(/[\\%_]/g, "\\$&");
const locOf = b => [b.book_number && "B-"+b.book_number, b.rack_number && "R-"+b.rack_number, b.shelf_number && "S-"+b.shelf_number].filter(Boolean).join(" | ");
async function findDups(d, excludeId){
  if(!d.title) return [];

  qb = d.volume ? qb.ilike("volume", likeEsc(d.volume)) : qb.is("volume", null);
  if(excludeId) qb = qb.neq("id", excludeId);
  const {data} = await qb; (data || []).forEach(b => cache[b.id] = b);

/* suggestions */
const SUG_LABEL = {title:"නම", author:"කතුවරයා", subject:"විෂයය", publisher:"ප්‍රකාශකයා"};
const sug = document.createElement("div"); sug.id = "sug"; sug.className = "hide"; document.body.appendChild(sug);
let sugInput = null, sugItems = [], sugIdx = -1, sugTimer, sugSeq = 0, skipSug = false;
document.querySelectorAll("[data-sug]").forEach(i => i.autocomplete = "off");
const sugOpen = () => !sug.classList.contains("hide");
function hideSug(){ sug.classList.add("hide"); sugItems = []; sugIdx = -1; }
const sugTerm = inp => inp.dataset.sug === "subject" ? inp.value.split("/").pop().trim() : inp.value.trim();
async function sugFetch(inp){
  const key = inp.dataset.sug, term = sugTerm(inp);
  if([...term].length < 2){ hideSug(); return; }
  const seq = ++sugSeq;
  const cols = key === "q" ? ["title","author","subject","publisher"] : [key];
  const res = await Promise.all(cols.map(c => sb.from("books").select(c).ilike(c, "%" + likeEsc(term) + "%").order(c).limit(150)));
  if(seq !== sugSeq || document.activeElement !== inp) return;
  const t = term.toLowerCase(), seen = new Set(); let items = [];
  res.forEach((r, i) => (r.data || []).forEach(row => {
    const vals = cols[i] === "subject" ? String(row.subject || "").split("/").map(x => x.trim()) : [row[cols[i]]];
    vals.forEach(v => { if(!v || !v.toLowerCase().includes(t)) return; const k = cols[i] + "|" + v.toLowerCase();
      if(seen.has(k)) return; seen.add(k); items.push({v, c:cols[i]}); });
  }));
  items.sort((a, b) => b.v.toLowerCase().startsWith(t) - a.v.toLowerCase().startsWith(t));
  items = items.slice(0, 8);
  if(!items.length || (items.length === 1 && items[0].v.toLowerCase() === t)){ hideSug(); return; }
  sugInput = inp; sugItems = items; sugIdx = -1;
  sug.innerHTML = items.map((it, i) => `<div data-i="${i}">${esc(it.v)}${key === "q" ? `<small>${SUG_LABEL[it.c]}</small>` : ""}</div>`).join("");
  const host = inp.closest("dialog") || document.body;
  if(sug.parentNode !== host) host.appendChild(sug);
  const r = inp.getBoundingClientRect();
  sug.style.left = r.left + "px"; sug.style.top = (r.bottom + 2) + "px"; sug.style.minWidth = r.width + "px"; sug.style.maxWidth = "92vw";
  sug.classList.remove("hide");
}
function sugPick(i){
  const it = sugItems[i], inp = sugInput; if(!it || !inp) return;
  if(inp.dataset.sug === "subject"){ const p = inp.value.split("/"); p[p.length-1] = it.v; inp.value = p.join("/"); } else inp.value = it.v;
  skipSug = true; inp.dispatchEvent(new Event("input", {bubbles:true})); skipSug = false;
  hideSug(); inp.focus();
}
function sugMark(){ [...sug.children].forEach((d, i) => d.classList.toggle("on", i === sugIdx)); }
document.addEventListener("input", e => {
  const inp = e.target; if(!inp.dataset || !inp.dataset.sug || skipSug) return;
  clearTimeout(sugTimer); sugTimer = setTimeout(() => sugFetch(inp), 200);
});
document.addEventListener("keydown", e => {
  if(!sugOpen() || e.target !== sugInput) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); sugIdx = (sugIdx + (e.key === "ArrowDown" ? 1 : -1) + sugItems.length) % sugItems.length; sugMark(); }
  else if(e.key === "Enter" && sugIdx >= 0){ e.preventDefault(); sugPick(sugIdx); }
  else if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); hideSug(); }
}, true);
sug.addEventListener("mousedown", e => { e.preventDefault(); const d = e.target.closest("[data-i]"); if(d) sugPick(+d.dataset.i); });
document.addEventListener("focusout", e => { if(e.target === sugInput) hideSug(); });
addEventListener("scroll", e => { if(e.target !== sug) hideSug(); }, true);
addEventListener("resize", hideSug);

/* queries */
function applyFilter(qb){
  const q = $("q").value.replace(/[,()%*]/g, " ").trim();
  const rk = clean($("fr").value), sh = clean($("fs").value);
  if(q) qb = qb.or(["title","author","subject","publisher","isbn","book_number"].map(c => `${c}.ilike.%${q}%`).join(","));
  if(rk) qb = qb.ilike("rack_number", rk.replace(/[%*_]/g, ""));
  if(sh) qb = qb.ilike("shelf_number", sh.replace(/[%*_]/g, ""));
  return qb;
}
async function fetchBooks(p, size, filtered){
  let qb = sb.from("books").select("*", {count:"exact"}).range(p*size, p*size + size - 1);
  if(filtered){
    qb = applyFilter(qb);
    qb = (clean($("fr").value) || clean($("fs").value)) ? qb.order("rack_number").order("shelf_number").order("book_number") : qb.order("id", {ascending:false});
  } else qb = qb.order("id", {ascending:false});
  return qb;
}
async function load(){
  const {data, error} = await fetchBooks(page, SIZE, false);
  if(error){ $("sstat").textContent = error.message; return; }
  $("pg").textContent = "පිටුව " + (page+1);
  $("tiles").innerHTML = data.map(b => tile(b, false)).join("") || `<div style="color:var(--mu)">පොත් නැත</div>`;
}
function go(n){ if(page + n < 0) return; page += n; load(); }
async function loadA(){
  let qb = sb.from("books").select("*", {count:"exact"}).range(apage*SIZE, apage*SIZE + SIZE - 1).order("id", {ascending:false});
  const aq = $("aq").value.replace(/[,()%*]/g, " ").trim();

/* statistics */
async function loadStats(){

    if(error){ $("sstat").textContent = error.message; return; }
    rows.push(...data); if(data.length < 1000) break;
  }
  const total = rows.reduce((s, r) => s + (Number(r.price) || 0), 0), adjT = rows.reduce((s, r) => s + (adjVal(r) || 0), 0);
  $("sstat").innerHTML = `පොත් ගණන: <b>${rows.length}</b> &nbsp;·&nbsp; මිල අනුව වටිනාකම: <b>${money(total)}</b> &nbsp;·&nbsp; කාලීන වටිනාකම: <b>${money(adjT)}</b>`;
  if(!isAdmin) return;
  let top = null, topA = null;
  rows.forEach(r => { if(r.price == null) return;
    if(!top || Number(r.price) > Number(top.price)) top = r;
    if(!topA || adjVal(r) > adjVal(topA)) topA = r; });
  const topK = (t, v) => t ? `<div>${esc(t.title || "(නම නැත)")}</div><span>${t.volume ? esc(t.volume) + " — " : ""}${money(v)}</span>` : "<div>—</div>";
  $("kpis").innerHTML =
    `<div class="kpi"><small>පොත් ගණන</small><div>${rows.length}</div></div>
     <div class="kpi"><small>සමස්ත වටිනාකම (මිල අනුව)</small><div>${money(total)}</div></div>
     <div class="kpi"><small>සමස්ත කාලීන වටිනාකම (වසරකට +${Math.round(GROWTH*100)}%)</small><div>${money(adjT)}</div></div>
     <div class="kpi"><small>වැඩිම වටිනා පොත (මිල)</small>${topK(top, top && top.price)}</div>
     <div class="kpi"><small>වැඩිම වටිනා පොත (කාලීන)</small>${topK(topA, topA && adjVal(topA))}</div>`;
  const m = {};
  rows.forEach(r => {
    const parts = [...new Set(String(r.subject || "").split("/").map(x => x.trim()).filter(Boolean))];
    (parts.length ? parts : ["(විෂයය නැත)"]).forEach(s => { m[s] = m[s] || {n:0, v:0, a:0}; m[s].n++; m[s].v += Number(r.price) || 0; m[s].a += adjVal(r) || 0; });
  });
  const list = Object.entries(m).sort((a, b) => b[1].n - a[1].n), max = list.length ? list[0][1].n : 1;
  $("subj").innerHTML = `<tr><th>විෂයය</th><th class="n">පොත් ගණන</th><th class="n">මිල අනුව</th><th class="n">කාලීන</th><th style="width:25%"></th></tr>` +
    list.map(([s, o]) => `<tr><td>${esc(s)}</td><td class="n">${o.n}</td><td class="n">${money(o.v)}</td><td class="n">${money(o.a)}</td><td><div class="barx" style="width:${Math.max(2, o.n / max * 100)}%"></div></td></tr>`).join("") +
    `<tr><td colspan="5" style="color:var(--mu);font-size:12px;border:0">* විෂයයන් කිහිපයක් (/) ඇති පොතක් එක් එක් විෂයය යටතේ ගණන් ගනී.<br>* කාලීන වටිනාකම = මිල × ${COMPOUND ? (1+GROWTH) + "^(වර්තමාන වර්ෂය − මුද්‍රිත වර්ෂය)" : "(1 + " + GROWTH + " × වසර ගණන)"}. මුද්‍රිත වර්ෂය නොමැති පොත් සඳහා මිල ම ගනී.</td></tr>`;
}

async function popSum(){

  for(let p = 0; ; p++){

    if(!data) break; data.forEach(r => { s += Number(r.price) || 0; a += adjVal(r) || 0; }); if(data.length < 1000) break;
  }

}

/* CSV import */
function parseCSV(t,d){
  const out = []; let r = [], c = "", q = false;
  for(let i = 0; i < t.length; i++){
    const ch = t[i];
    if(q){ if(ch === '"'){ if(t[i+1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if(ch === '"') q = true;
    else if(ch === d){ r.push(c); c = ""; }
    else if(ch === "\n"){ r.push(c); out.push(r); r = []; c = ""; }
    else if(ch !== "\r") c += ch;
  }
  if(c !== "" || r.length){ r.push(c); out.push(r); }
  return out;
}
async function importCSV(file){
  if(!file) return;
  const t = (await file.text()).replace(/^\uFEFF/, "");
  const first = t.split("\n")[0];
  const d = first.includes("\t") ? "\t" : (first.includes(";") && !first.includes(",") ? ";" : ",");
  const [h, ...body] = parseCSV(t, d);
  const idx = {}; h.forEach((x,i) => idx[x.trim().toLowerCase()] = i);
  if(!F.some(k => idx[k] !== undefined)){ say("Import දෝෂය: පළමු පේළියේ title, author, subject... headings නැත."); return; }
  const recs = body.map(r => { const o = {}; F.forEach(k => o[k] = idx[k] === undefined ? null : clean(r[idx[k]]));
    return numFix(o); }).filter(o => !isEmpty(o));
  const keyOf = o => (o.title || "").trim().toLowerCase() + "|" + (o.volume || "").trim().toLowerCase();
  const seen = new Set();
  for(let p = 0; ; p++){
    const {data, error} = await sb.from("books").select("title,volume").order("id").range(p*1000, p*1000 + 999);
    if(error){ say("Import දෝෂය: " + error.message); return; }
    data.forEach(o => { if(o.title) seen.add(keyOf(o)); });
    say("පවතින පොත් පරීක්ෂා කරමින්... " + (p*1000 + data.length));
    if(data.length < 1000) break;
  }
  let skipped = 0;
  const fresh = recs.filter(o => { if(!o.title) return true; const k = keyOf(o); if(seen.has(k)){ skipped++; return false; } seen.add(k); return true; });
  await refreshNextNo(); const used = new Set(usedNos); fresh.forEach(o => { if(o.book_number) used.add(o.book_number); });
  let n = 1; fresh.forEach(o => { if(!o.book_number){ while(used.has(String(n))) n++; o.book_number = String(n); used.add(o.book_number); } });
  for(let i = 0; i < fresh.length; i += 500){
    const {error} = await sb.from("books").insert(fresh.slice(i, i+500));
    if(error){ say("Import දෝෂය: " + error.message); return; }
    say(`Import කරමින්... ${Math.min(i+500, fresh.length)} / ${fresh.length}`);
  }
  say(`පොත් ${fresh.length}ක් Import කළා ✔` + (skipped ? ` (නම සහ කොටස සමාන නිසා ${skipped}ක් මඟ හැරියා)` : "")); $("csv").value = ""; refresh();
}

/* copy */
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add("hide"), 2200); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copy කළා ✔");
}
const bookLine = b => [b.title + (b.volume ? " (" + b.volume + ")" : ""), b.author, b.subject, b.publisher, b.print_year, b.pages != null && b.pages + " පිටු", b.isbn && "ISBN " + b.isbn, locOf(b), b.price != null && money(b.price), hasAdj(b) && "කාලීන " + money(adjVal(b))].filter(Boolean).join(" | ");
function copyBook(id){ copyText(bookLine(cache[id])); }
async function copyResults(){
  toast("සූදානම් කරමින්...");
  const sorted = clean($("fr").value) || clean($("fs").value), rows = [];
  for(let p = 0; ; p++){
    let qb = applyFilter(sb.from("books").select("*"));
    qb = sorted ? qb.order("rack_number").order("shelf_number").order("book_number") : qb.order("id", {ascending:false});
    const {data, error} = await qb.range(p*1000, p*1000 + 999);
    if(error){ toast(error.message); return; }
    rows.push(...data); if(data.length < 1000) break;
  }
  copyText(rows.map((b, i) => (i+1) + ". " + bookLine(b)).join("\n"));
}

/* export (admin) */
async function allRows(){
  const rows = [];
  for(let p = 0; ; p++){
    const {data, error} = await sb.from("books").select("*").order("id").range(p*1000, p*1000 + 999);
    if(error){ alert(error.message); return null; }
    rows.push(...data); if(data.length < 1000) break;
  }
  rows.forEach(r => r._adj = r.price != null ? Math.round(adjVal(r) * 100) / 100 : null);
  return rows;
}
function exportCols(rows){
  const keys = new Set(); rows.forEach(r => Object.keys(r).forEach(k => keys.add(k)));
  const lab = Object.fromEntries([...FIELDS.map(f => [f[0], f[1].replace(/\s*\(.*\)/, "")]), ["_adj", "කාලීන වටිනාකම"]]);
  return ["id", ...F, ...[...keys].filter(k => k !== "id" && !F.includes(k))].filter(k => keys.has(k)).map(k => [k, lab[k] || k]);
}
const stamp = () => new Date().toISOString().slice(0, 10);
async function exportXLSX(){
  if(!window.XLSX){ alert("Excel library එක load වී නැත (Internet පරීක්ෂා කරන්න)."); return; }
  toast("සූදානම් කරමින්..."); const rows = await allRows(); if(!rows) return;
  const c = exportCols(rows);
  const ws = XLSX.utils.aoa_to_sheet([c.map(x => x[1]), ...rows.map(r => c.map(([k]) => r[k] ?? ""))]);
  ws["!cols"] = c.map(([k]) => ({wch: k === "title" || k === "author" || k === "subject" ? 28 : 14}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Books");
  XLSX.writeFile(wb, "library-" + stamp() + ".xlsx"); toast("Excel Download වෙමින් ✔");
}
async function exportPDF(){
  toast("සූදානම් කරමින්..."); const rows = await allRows(); if(!rows) return;
  const c = exportCols(rows), total = rows.reduce((s, r) => s + (Number(r.price) || 0), 0);
  $("printarea").innerHTML = `<h2>📚 මගේ පුස්තකාලය</h2><p>${stamp()} · පොත් ගණන: ${rows.length} · සමස්ත වටිනාකම: ${money(total)} · කාලීන: ${money(rows.reduce((s, r) => s + (adjVal(r) || 0), 0))}</p>
    <table><thead><tr>${c.map(x => `<th>${esc(x[1])}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${c.map(([k]) => `<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  document.body.classList.add("printing");
  addEventListener("afterprint", () => { document.body.classList.remove("printing"); $("printarea").innerHTML = ""; }, {once:true});
  setTimeout(() => print(), 150);
}
